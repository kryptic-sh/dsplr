[package]
name = "dsplr-backend"
description = "Desktop backends of dsplr: Hyprland, wlroots, KDE, GNOME and X11."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[dependencies]
dsplr-model.workspace = true
dsplr-persist.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
crcbl-wayland = "0.18.0"

[build-dependencies]
crcbl-wl-scanner = "0.18.0"
