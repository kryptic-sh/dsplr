name: CI

# fmt, clippy, tests, a smoke run and dependency hygiene. dsplr is Linux-only,
# so every job runs on ubuntu. Release jobs arrive at M9 — see
# docs/plan/10-ci-and-release.md.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group:
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - run: rustup update --no-self-update stable
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run:
          cargo clippy --workspace --all-targets --all-features --locked -- -D
          warnings

  machete:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Plain `cargo audit` fails only on real vulnerabilities; unmaintained /
      # yanked advisories are warnings, matching deny.toml's policy.
      - run: cargo audit

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run:
          cargo nextest run --workspace --all-features --locked --no-fail-fast
          --no-tests=warn
      - run: cargo test --workspace --doc --all-features --locked

  # tmxr's guard: the suite again with $HOME and the XDG directories pointed
  # at an empty sentinel, failing if a test writes there or into dsplr's real
  # directories.
  leak-guard:
    name: no test writes real user state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - shell: bash
        run: |
          set -euo pipefail
          sentinel=$(mktemp -d)
          marker=$(mktemp)
          # cargo and rustup find their own homes through $HOME: pin the real ones.
          export CARGO_HOME=${CARGO_HOME:-$HOME/.cargo} RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}
          real_home=$HOME
          HOME=$sentinel \
            XDG_CONFIG_HOME=$sentinel/config XDG_DATA_HOME=$sentinel/data \
            XDG_STATE_HOME=$sentinel/state XDG_CACHE_HOME=$sentinel/cache \
            cargo nextest run --workspace --all-features --locked --no-fail-fast \
            --no-tests=warn \
            && tests=0 || tests=$?
          leaked=""
          for d in config data state cache .config .local .cache; do
            if [ -e "$sentinel/$d" ]; then leaked+=$(find "$sentinel/$d"); fi
          done
          for d in .config/dsplr .local/share/dsplr .local/state/dsplr .cache/dsplr .config/hypr .config/niri; do
            if [ -e "$real_home/$d" ]; then leaked+=$(find "$real_home/$d" -newer "$marker"); fi
          done
          if [ -n "$leaked" ]; then
            echo "tests wrote outside their own directories:" >&2
            echo "$leaked" >&2
            exit 1
          fi
          echo "leak guard: nothing written to the sentinel home or dsplr's real dirs"
          exit "$tests"

  smoke:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p dsplr
      - run: cargo run --locked -p dsplr -- --version
      - run: cargo run --locked -p dsplr -- --help

  # Each desktop's e2e test against the real compositor, run headless under
  # its harness in tests/e2e/. A runner has no GPU render node, and Hyprland
  # cannot allocate buffers without one (vgem's GBM fails too), so the test
  # runs in a KVM VM with a virtio GPU, as Hyprland's own CI does. The VM is
  # an Arch cloud image: Ubuntu's Hyprland predates the Lua config. sway
  # needs no GPU (pixman), but runs in the same VM so it is the current sway,
  # through the same steps. niri has no headless backend, so it runs nested
  # (winit) in a headless sway, rendering through Mesa's software EGL. KWin
  # runs on its own virtual backend, which still renders with OpenGL.
  e2e:
    name: e2e ${{ matrix.desktop }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - desktop: hyprland
            packages: hyprland kwin mesa
            tests: dsplr-backend dsplr
          - desktop: sway
            packages: sway
            tests: dsplr-backend dsplr
          - desktop: niri
            packages: sway niri mesa
            tests: dsplr-backend dsplr
          - desktop: kwin
            packages: kwin mesa
            tests: dsplr-backend dsplr
    env:
      IMAGE: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests and fill the VM's share
        run: |
          share="$RUNNER_TEMP/e2e"
          mkdir -p "$share/out" "$share/tests"
          chmod 777 "$share/out"
          # Every package's <desktop>_e2e test, and dsplr itself for the CLI's.
          for package in ${{ matrix.tests }}; do
            test_bin=$(cargo test --locked -p "$package" --test "${{ matrix.desktop }}_e2e" --no-run --message-format=json \
              | jq -r 'select(.reason == "compiler-artifact" and .target.name == "${{ matrix.desktop }}_e2e") | .executable')
            [ -x "$test_bin" ] || { echo "no ${{ matrix.desktop }} test in $package"; exit 1; }
            cp "$test_bin" "$share/tests/$package"
          done
          cargo build --locked -p dsplr
          cp target/debug/dsplr "$share/"
          cp "tests/e2e/headless-${{ matrix.desktop }}.sh" "$share/harness.sh"
          cp tests/e2e/vm/guest.sh "$share/"
          echo "${{ matrix.packages }}" > "$share/packages"
      - name: Enable KVM and install QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Fetch the Arch cloud image
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "$IMAGE"
          curl -fsSLO "$IMAGE.SHA256"
          sha256sum -c Arch-Linux-x86_64-cloudimg.qcow2.SHA256
          qemu-img resize Arch-Linux-x86_64-cloudimg.qcow2 +6G
          printf '%s\n' '#cloud-config' 'runcmd:' \
            '  - [bash, -c, "mkdir -p /e2e && mount -t 9p -o trans=virtio,version=9p2000.L e2e /e2e && bash /e2e/guest.sh"]' \
            > user-data
          cloud-localds seed.img user-data
      - name: Run the test in the VM
        run: |
          cd "$RUNNER_TEMP"
          timeout 30m qemu-system-x86_64 -enable-kvm -cpu host -m 6G -smp 4 -nographic \
            -drive file=Arch-Linux-x86_64-cloudimg.qcow2,if=virtio \
            -drive file=seed.img,if=virtio,format=raw \
            -virtfs local,path="$RUNNER_TEMP/e2e",mount_tag=e2e,security_model=none,id=e2e \
            -vga none -device virtio-gpu-pci -nic user,model=virtio-net-pci \
            > vm-console.log 2>&1 || true
          out="$RUNNER_TEMP/e2e/out"
          cat "$out"/test-*.log || true
          status=$(cat "$out/status" 2>/dev/null || echo "missing: the VM did not finish")
          echo "status: $status"
          if [ "$status" != 0 ]; then
            echo "== /dev/dri"; cat "$out/dri.txt" || true
            echo "== pacman (tail)"; tail -n 20 "$out/pacman.log" || true
            echo "== VM console (tail)"; tail -n 60 vm-console.log
            exit 1
          fi
